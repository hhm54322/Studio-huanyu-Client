map $http_accept $huanyu_image_suffix {
    default "";
    "~*webp" ".optimized.webp";
}

server {
    server_name huanyumedical.com www.huanyumedical.com;
    root /var/www/huanyu;
    index index.html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
        try_files /version.json =404;
    }
    location ~* ^/images/.*\.(png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Vary Accept always;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri$huanyu_image_suffix $uri =404;
    }
    location ~* \.(js|css|webp|png|jpg|jpeg|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/huanyumedical.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huanyumedical.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name huanyumedical.com www.huanyumedical.com;
    return 301 https://$host$request_uri;
}
