# Include inside the existing huanyu-web server block, before legacy regex
# image/font locations. Do not use these rules on API or upload directories.
location ^~ /assets/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}
location ^~ /static-assets/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}
location ^~ /patient-shell/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
}
location = /patient-cache-sw.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location = /asset-cache-manifest.json {
    expires off;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
