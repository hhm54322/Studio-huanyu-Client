# Include in nginx's http context, outside the server block. The SPA redirect
# changes $uri to /index.html; $request_uri preserves the original public path.
# CDN must include Cookie and Authorization in its cache key before enabling
# shared HTML caching. Never force-cache private/no-store responses.
map "$host|$http_authorization|$http_cookie|$request_method|$request_uri" $huanyu_public_html_cache {
    default "private, no-store, no-cache, max-age=0";
    "~^(?:www\.huanyumedical\.com|huanyumedical\.com)\|\|\|(?:GET|HEAD)\|(?:/|/dental)(?:\?.*)?$" "public, max-age=0, s-maxage=60, must-revalidate";
}
