# Include inside the patient site's server block. Existing files and directories
# are served normally; only real client routes receive the SPA entry document.
location / {
    try_files $uri $uri/ @huanyu_patient_spa;
}

location @huanyu_patient_spa {
    if ($uri ~ "^/(why-china|trust|insurance|hospitals|doctors|report|professional-report|cases|dental|diseases-technologies|equipment|visa|steps|about|cost|cost-generated|steps/toolkit-detail|hospital|hospital/solutions|hospital/cases|hospital/api|hospital/apply)/?$") {
        rewrite ^ /index.html last;
    }
    if ($uri ~ "^/dental/doctors/(tan-zhaolin|che-yinglin|wan-qiancheng|li-teng|huang-jianrong|zheng-rui|jiang-gang)/?$") {
        rewrite ^ /index.html last;
    }
    return 404;
}
