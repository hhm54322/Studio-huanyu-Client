# Included in nginx http context, before the site server.
map $arg_article $huanyu_guide_target {
    default "";
    assessment /guides/assessment;
    companions /guides/companions;
    medication-entry /guides/medication-entry;
    muslim /guides/muslim;
    steps-flow /guides/steps-flow;
    visa /guides/visa;
}
# Remove only the recognized article selector; retain language and attribution.
map $args $huanyu_guide_args {
    default $args;
    "~^article=(assessment|companions|medication-entry|muslim|steps-flow|visa)$" "";
    "~^article=(assessment|companions|medication-entry|muslim|steps-flow|visa)&(?<guide_tail>.+)$" $guide_tail;
    "~^(?<guide_head>.+)&article=(assessment|companions|medication-entry|muslim|steps-flow|visa)$" $guide_head;
    "~^(?<guide_prefix>.+)&article=(assessment|companions|medication-entry|muslim|steps-flow|visa)&(?<guide_suffix>.+)$" "$guide_prefix&$guide_suffix";
}
map $huanyu_guide_args $huanyu_guide_suffix {
    "" "";
    default "?$huanyu_guide_args";
}
